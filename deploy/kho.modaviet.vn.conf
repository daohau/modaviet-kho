server {
    listen 80;
    listen [::]:80;
    server_name kho.modaviet.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/kho.modaviet.vn/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kho.modaviet.vn;

    root /www/wwwroot/kho.modaviet.vn/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    ssl_certificate /www/server/panel/vhost/cert/kho.modaviet.vn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kho.modaviet.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;

        fastcgi_param KHO_ENV production;
        fastcgi_param KHO_DB_HOST 127.0.0.1;
        fastcgi_param KHO_DB_PORT 3306;
        fastcgi_param KHO_DB_NAME kho_npl;
        fastcgi_param KHO_DB_USER kho_npl_app;
        fastcgi_param KHO_DB_PASS __KHO_DB_PASS__;
    }

    location ~* /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* /(?:app|config|data|database|views)(?:/|$) {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|env|ini|log|bak|key|pem)$ {
        deny all;
        return 404;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /www/wwwlogs/kho.modaviet.vn.log;
    error_log /www/wwwlogs/kho.modaviet.vn.error.log;
}
