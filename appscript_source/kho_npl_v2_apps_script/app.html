<script>
const state={bootstrap:null,reservationLines:[],receiptLines:[],issueLines:[],returnLines:[],adjustmentCtx:null,reversalPreview:null,documents:[],lastDocumentCode:'',pendingReq:{reservation:null,receipt:null,issue:null,ret:null,adj:null,rev:null},submitting:false};
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function busy(v){$('busy').classList.toggle('hidden',!v)}
function toast(msg,err=false){const x=$('toast');x.textContent=msg;x.className='toast'+(err?' err':'');x.style.display='block';setTimeout(()=>x.style.display='none',4000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function fmt(v){return n(v).toLocaleString('vi-VN',{maximumFractionDigits:3})}
function reqId(){return 'WEB-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function stableReq(kind){if(!state.pendingReq[kind])state.pendingReq[kind]=reqId();return state.pendingReq[kind]}
function clearReq(kind){state.pendingReq[kind]=null}
function beginSubmit(){if(state.submitting)return false;state.submitting=true;busy(true);return true}
function endSubmit(){state.submitting=false;busy(false)}
function upperCodeInput(id){const el=$(id);if(!el)return;el.addEventListener('input',()=>{const start=el.selectionStart,end=el.selectionEnd;el.value=el.value.toUpperCase();try{el.setSelectionRange(start,end)}catch(_){}})}
['pExecution','iExecution','tExecution','aMaterial','rvCode','dCode','dExecution','dMaterial','dSupplier'].forEach(upperCodeInput);

function friendlyError(raw){
  let m=String(raw||'Có lỗi xảy ra').replace(/^Exception:\s*/,'');
  const map=[
    ['AUTH_DENIED:','Bạn không có quyền thực hiện thao tác này.'],
    ['BLOCK_AM_KHO:','Không thể ghi sổ vì số lượng sẽ làm tồn kho âm.'],
    ['BLOCK_MASTER_DUPLICATE:','Mã vật tư đang bị trùng trong danh mục. Cần xử lý Master trước.'],
    ['BLOCK_TRUNG_YEU_CAU:','Yêu cầu này đã được hệ thống xử lý trước đó.'],
    ['BLOCK_RESERVATION:','Không thể giữ/xuất vượt phần tồn được phép.'],
    ['BLOCK_REVERSAL_RECEIPT:','Không thể đảo Phiếu nhập vì vật tư đã có giao dịch phát sinh sau đó. Hãy dùng Điều chỉnh tồn.'],
    ['BLOCK_REVERSAL_ISSUE:','Không thể đảo Phiếu xuất vì đã có Phiếu trả NPL liên quan. Hãy đảo Phiếu trả trước.'],
    ['BLOCK_VALIDATION:','Dữ liệu chưa hợp lệ.'],
    ['NO_ACTIVE_REQUIREMENT:','Không có nhu cầu NPL đang hoạt động cho mã này.'],
    ['SYNC_CONFIG_MISSING:','Thiếu cấu hình nguồn dữ liệu.'],
    ['OPENING_BALANCE_LOCKED:','Tồn đầu đang được khóa an toàn.']
  ];
  for(const [p,txt] of map){if(m.startsWith(p))return txt+'\n'+m.slice(p.length).trim();}
  return m.replace(/_/g,' ');
}
function showModal({type='success',title='Hoàn tất',message='',code='',details='',allowView=false}){
  const card=$('modal').querySelector('.modalCard');card.classList.toggle('error',type==='error');
  $('modalIcon').textContent=type==='error'?'!':'✓';$('modalTitle').textContent=title;$('modalMessage').textContent=message;
  $('modalCode').textContent=code||'';$('modalCode').classList.toggle('hidden',!code);
  $('modalDetails').textContent=details||'';$('modalDetails').classList.toggle('hidden',!details);
  state.lastDocumentCode=allowView?String(code||'').toUpperCase():'';
  $('modalViewDoc').classList.toggle('hidden',!state.lastDocumentCode);
  $('modal').classList.remove('hidden');
}
function isDocumentCode(code){return /^(PN|PX|TL|DC|RV)\d/i.test(String(code||''))}
function showSuccess(message,code='',details=''){showModal({type:'success',title:'Ghi sổ thành công',message,code,details,allowView:isDocumentCode(code)})}
function showError(err){showModal({type:'error',title:'Không thể thực hiện',message:friendlyError(err&&err.message?err.message:err)})}
$('modalOk').onclick=()=>$('modal').classList.add('hidden');
$('modalViewDoc').onclick=async()=>{const code=state.lastDocumentCode;$('modal').classList.add('hidden');if(code)await showDocumentDetail(code)};

function call(name,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));switch(name){
  case 'apiBootstrap':return r.apiBootstrap();case 'apiListOpenPrs':return r.apiListOpenPrs(...args);case 'apiGetPrLines':return r.apiGetPrLines(...args);case 'apiCreateAndPostReceipt':return r.apiCreateAndPostReceipt(...args);
  case 'apiReservationContext':return r.apiReservationContext(...args);case 'apiConfirmReservations':return r.apiConfirmReservations(...args);
  case 'apiIssueContext':return r.apiIssueContext(...args);case 'apiCreateAndPostIssue':return r.apiCreateAndPostIssue(...args);case 'apiReturnableIssues':return r.apiReturnableIssues(...args);case 'apiCreateAndPostReturn':return r.apiCreateAndPostReturn(...args);
  case 'apiSearchStock':return r.apiSearchStock(...args);case 'apiAdjustmentContext':return r.apiAdjustmentContext(...args);case 'apiCreateAndPostAdjustment':return r.apiCreateAndPostAdjustment(...args);case 'apiListDocuments':return r.apiListDocuments(...args);case 'apiDocumentDetail':return r.apiDocumentDetail(...args);case 'apiReversalPreview':return r.apiReversalPreview(...args);case 'apiReversePostedDocument':return r.apiReversePostedDocument(...args);
  case 'apiSyncAll':return r.apiSyncAll(...args);case 'apiInstallSyncTriggers':return r.apiInstallSyncTriggers(...args);case 'apiSyncStatus':return r.apiSyncStatus(...args);case 'apiSystemHealth':return r.apiSystemHealth(...args);
  default:return reject(new Error('API không hỗ trợ: '+name));}});}

function roleHas(...wanted){const roles=state.bootstrap?.roles||[];return roles.includes('ADMIN')||roles.includes('PILOT_ADMIN')||wanted.some(r=>roles.includes(r));}
function applyRoles(){
  document.querySelectorAll('.role-plan').forEach(x=>x.classList.toggle('hidden',!roleHas('PROCUREMENT','PRODUCTION_MANAGER')));
  document.querySelectorAll('.role-warehouse').forEach(x=>x.classList.toggle('hidden',!roleHas('WAREHOUSE')));
  document.querySelectorAll('.role-adjust').forEach(x=>x.classList.toggle('hidden',!roleHas('PRODUCTION_MANAGER')));
  document.querySelectorAll('.role-admin').forEach(x=>x.classList.toggle('hidden',!roleHas('ADMIN')));
}
function openView(name){const b=document.querySelector(`.tab[data-view="${name}"]`);if(!b||b.classList.contains('hidden'))return false;document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('view-'+name).classList.add('active');return true}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openView(b.dataset.view));

function renderSync(rows){if(!rows||!rows.length){$('syncLines').innerHTML='<div class="hint" style="padding:10px">Chưa có trạng thái đồng bộ.</div>';return;}let s='<table><thead><tr><th>Nguồn</th><th>File/Sheet</th><th>Lần đồng bộ</th><th>Trạng thái</th></tr></thead><tbody>';rows.forEach(x=>{const cls=(x.status||'').toUpperCase().includes('LỖI')?'statusBlock':'statusPass';s+=`<tr><td>${esc(x.sourceCode)}</td><td>${esc(x.fileTitle)} / ${esc(x.sheetName)}</td><td>${esc(x.lastSync||'-')}</td><td class="${cls}">${esc(x.status||'-')}</td></tr>`});$('syncLines').innerHTML=s+'</tbody></table>'}
function renderHealth(h){if(!h){$('healthLines').innerHTML='';return;}let s='<table><thead><tr><th>Kiểm tra</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody>';h.checks.forEach(x=>{const cls=x.status==='PASS'?'statusPass':(x.status==='WARN'?'statusWarn':'statusBlock');s+=`<tr><td>${esc(x.code)}</td><td class="${cls}">${esc(x.status)}</td><td>${esc(x.detail)}</td></tr>`});$('healthLines').innerHTML=s+'</tbody></table>'}

async function init(){try{busy(true);const b=await call('apiBootstrap');state.bootstrap=b;$('env').textContent=b.environment+' • '+(b.environment==='PRODUCTION'?'Vận hành chính thức':'Chỉ thao tác trên Pilot');$('user').textContent=b.user||'User';$('homeEnv').textContent=b.environment;$('homeRoles').textContent=(b.roles||[]).join(', ')||'Chưa cấp quyền';$('openingCount').textContent=b.opening.candidateCount+' ứng viên';$('openingStatus').textContent=b.opening.postEnabled?'Đã mở':'Đang khóa';$('codeStatus').textContent=(b.runtimeVersion||b.codeStatus||'')+' / '+(b.deployStatus||'');$('healthStatus').textContent=b.health?.status||'-';const sync=b.syncStatus||[];$('homeSync').textContent=sync.filter(x=>(x.status||'').toUpperCase().startsWith('OK')).length+'/'+sync.length+' nguồn OK';$('rSupplier').innerHTML='<option value="">-- Chọn NCC --</option>'+b.suppliers.map(x=>`<option value="${esc(x.supplierId)}">${esc(x.supplierName)} (${x.openPrCount} ĐNMH)</option>`).join('');['rDate','iDate','tDate','aDate'].forEach(id=>$(id).value=today());applyRoles();renderSync(sync);renderHealth(b.health);}catch(e){showError(e)}finally{busy(false)}}

// GIỮ TỒN
$('btnLoadPlan').onclick=async()=>{try{busy(true);state.reservationLines=await call('apiReservationContext',$('pExecution').value.trim().toUpperCase());renderPlan()}catch(e){showError(e)}finally{busy(false)}};
function renderPlan(){let s='<table><thead><tr><th>SP</th><th>Vật tư</th><th>Nhu cầu</th><th>Đã xuất</th><th>Đang giữ</th><th>Tồn vật lý</th><th>Khả dụng chung</th><th>Đề xuất</th><th>SL giữ xác nhận</th></tr></thead><tbody>';state.reservationLines.forEach((x,i)=>{s+=`<tr><td>${esc(x.productCode)}</td><td>${esc(x.materialId)}<br>${esc(x.materialName)} (${esc(x.uom)})</td><td>${fmt(x.requiredQty)}</td><td>${fmt(x.issuedQty)}</td><td>${fmt(x.currentRemainingReservedQty)}</td><td>${fmt(x.physicalStock)}</td><td>${fmt(x.globalAvailable)}</td><td>${fmt(x.suggestedRemainingReservedQty)}</td><td><input data-pq="${i}" type="number" min="0" max="${x.maxRemainingReservedQty}" step="0.001" value="${x.currentRemainingReservedQty}"></td></tr>`});$('pLines').innerHTML=s+'</tbody></table>'}
$('btnUseSuggested').onclick=()=>{state.reservationLines.forEach((x,i)=>{const el=document.querySelector(`[data-pq="${i}"]`);if(el)el.value=x.suggestedRemainingReservedQty})};
$('btnSaveReservations').onclick=async()=>{if(!beginSubmit())return;try{const lines=state.reservationLines.map((x,i)=>({requirementKey:x.requirementKey,remainingReservedQty:n(document.querySelector(`[data-pq="${i}"]`)?.value)}));const res=await call('apiConfirmReservations',{executionCode:$('pExecution').value.trim().toUpperCase(),clientRequestId:stableReq('reservation'),lines});clearReq('reservation');state.reservationLines=res.context||await call('apiReservationContext',$('pExecution').value.trim().toUpperCase());renderPlan();showSuccess('Đã cập nhật giữ tồn cho '+$('pExecution').value.trim().toUpperCase(),'GIỮ TỒN',`Tạo mới: ${res.created||0}\nCập nhật: ${res.updated||0}`)}catch(e){showError(e)}finally{endSubmit()}};

// NHẬP KHO
$('rSupplier').onchange=async()=>{const id=$('rSupplier').value;$('rPr').innerHTML='<option value="">-- Chọn ĐNMH --</option>';$('rLines').innerHTML='';if(!id)return;try{busy(true);const prs=await call('apiListOpenPrs',id);$('rPr').innerHTML+=[...prs].map(x=>`<option value="${esc(x.prCode)}">${esc(x.prCode)} • ${x.lineCount} dòng</option>`).join('')}catch(e){showError(e)}finally{busy(false)}};
$('rPr').onchange=async()=>{const sid=$('rSupplier').value,pr=$('rPr').value;if(!pr)return;try{busy(true);state.receiptLines=await call('apiGetPrLines',sid,pr);renderReceipt()}catch(e){showError(e)}finally{busy(false)}};
function renderReceipt(){const h=['Vật tư','Đơn/SP','Còn','SL giao','SL đạt','Giá','Chất lượng','Lý do vượt'];let s='<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';state.receiptLines.forEach((x,i)=>{s+=`<tr><td>${esc(x.materialId)}<br>${esc(x.materialName)} (${esc(x.uom)})</td><td>${esc(x.executionCode)}<br>${esc(x.productCode)}</td><td>${fmt(x.remainingQty)}</td><td><input data-r="del" data-i="${i}" type="number" min="0" step="0.001"></td><td><input data-r="acc" data-i="${i}" type="number" min="0" step="0.001"></td><td><input data-r="price" data-i="${i}" type="number" min="0" value="${x.estimatedUnitPrice||0}"></td><td><select data-r="q" data-i="${i}"><option value="ACCEPTED">Đạt</option><option value="PARTIAL_REJECT">Đạt một phần</option><option value="REJECTED">Không đạt</option></select></td><td><input data-r="over" data-i="${i}"></td></tr>`});$('rLines').innerHTML=s+'</tbody></table>'}
$('btnPostReceipt').onclick=async()=>{if(!beginSubmit())return;try{const rows=[...$('rLines').querySelectorAll('tr')].slice(1);const lines=state.receiptLines.map((x,i)=>{const q=sel=>rows[i]?.querySelector(sel);return {prRefKey:x.prRefKey,deliveredQty:n(q('[data-r="del"]')?.value),acceptedQty:n(q('[data-r="acc"]')?.value),actualUnitPrice:n(q('[data-r="price"]')?.value),qualityStatus:q('[data-r="q"]')?.value,overReceiptReason:q('[data-r="over"]')?.value||''}}).filter(x=>x.deliveredQty>0||x.acceptedQty>0);if(!lines.length)throw new Error('Chưa nhập số lượng nhận');const res=await call('apiCreateAndPostReceipt',{supplierId:$('rSupplier').value,receiptDate:$('rDate').value,deliveryNoteNo:$('rDelivery').value,deliveredBy:$('rDeliveredBy').value,note:$('rNote').value,clientRequestId:stableReq('receipt'),lines});clearReq('receipt');showSuccess('Phiếu nhập đã được ghi sổ.',res.receiptCode,'Tồn kho, công nợ nguồn và nhật ký đã cập nhật.');$('rPr').dispatchEvent(new Event('change'))}catch(e){showError(e)}finally{endSubmit()}};

// XUẤT KHO
$('btnLoadIssue').onclick=async()=>{try{busy(true);state.issueLines=await call('apiIssueContext',$('iExecution').value.trim().toUpperCase());renderIssue()}catch(e){showError(e)}finally{busy(false)}};
function renderIssue(){let s='<table><thead><tr><th>SP</th><th>Vật tư</th><th>Còn giữ</th><th>Tồn</th><th>Được xuất</th><th>Giá BQ</th><th>SL xuất</th><th>Lý do vượt ĐM</th></tr></thead><tbody>';state.issueLines.forEach((x,i)=>{s+=`<tr><td>${esc(x.productCode)}</td><td>${esc(x.materialId)}<br>${esc(x.materialName)}</td><td>${fmt(x.remainingReservedQty)}</td><td>${fmt(x.physicalStock)}</td><td>${fmt(x.allowedForThisOrder)}</td><td>${fmt(x.avgCost)}</td><td><input data-iq="${i}" type="number" min="0" step="0.001"></td><td><input data-ir="${i}"></td></tr>`});$('iLines').innerHTML=s+'</tbody></table>'}
$('btnPostIssue').onclick=async()=>{if(!beginSubmit())return;try{const rows=[...$('iLines').querySelectorAll('tr')].slice(1);const lines=state.issueLines.map((x,i)=>({reservationId:x.reservationId,materialName:x.materialName,uom:x.uom,issueQty:n(rows[i]?.querySelector(`[data-iq="${i}"]`)?.value),varianceReason:rows[i]?.querySelector(`[data-ir="${i}"]`)?.value||''})).filter(x=>x.issueQty>0);if(!lines.length)throw new Error('Chưa nhập số lượng xuất');const res=await call('apiCreateAndPostIssue',{executionCode:$('iExecution').value.trim().toUpperCase(),issueDate:$('iDate').value,issueType:'PRODUCTION',receiver:$('iReceiver').value,note:$('iNote').value,clientRequestId:stableReq('issue'),lines});clearReq('issue');showSuccess('Phiếu xuất đã được ghi sổ.',res.issueCode,'Tồn kho, phần đã giữ và chi phí vật tư đã cập nhật.');$('btnLoadIssue').click()}catch(e){showError(e)}finally{endSubmit()}};

// TRẢ NPL
$('btnLoadReturn').onclick=async()=>{try{busy(true);state.returnLines=await call('apiReturnableIssues',$('tExecution').value.trim().toUpperCase());renderReturn()}catch(e){showError(e)}finally{busy(false)}};
function renderReturn(){let s='<table><thead><tr><th>Chọn</th><th>Phiếu xuất</th><th>SP</th><th>Vật tư</th><th>Đã xuất</th><th>Còn có thể trả</th><th>SL trả</th><th>Còn dùng</th><th>Phế</th></tr></thead><tbody>';state.returnLines.forEach((x,i)=>{s+=`<tr><td><input name="retPick" data-rp="${i}" type="radio"></td><td>${esc(x.issueCode)}</td><td>${esc(x.productCode)}</td><td>${esc(x.materialId)}<br>${esc(x.materialName)}</td><td>${fmt(x.issuedQty)}</td><td>${fmt(x.returnableQty)}</td><td><input data-rq="${i}" type="number" min="0" step="0.001"></td><td><input data-ru="${i}" type="number" min="0" step="0.001"></td><td><input data-rs="${i}" type="number" min="0" step="0.001" value="0"></td></tr>`});$('tLines').innerHTML=s+'</tbody></table>'}
$('btnPostReturn').onclick=async()=>{if(!beginSubmit())return;try{const pick=$('tLines').querySelector('input[name="retPick"]:checked');if(!pick)throw new Error('Chưa chọn dòng xuất cần trả');const i=Number(pick.dataset.rp),row=[...$('tLines').querySelectorAll('tr')].slice(1)[i],x=state.returnLines[i];const res=await call('apiCreateAndPostReturn',{sourceIssueLineId:x.issueLineId,returnDate:$('tDate').value,returnQty:n(row.querySelector(`[data-rq="${i}"]`).value),usableQty:n(row.querySelector(`[data-ru="${i}"]`).value),scrapQty:n(row.querySelector(`[data-rs="${i}"]`).value),returnedBy:$('tReturnedBy').value,note:$('tNote').value,clientRequestId:stableReq('ret')});clearReq('ret');showSuccess('Phiếu trả NPL đã được ghi sổ.',res.returnCode,'Phần còn dùng đã nhập lại tồn và chi phí thực dùng đã cập nhật.');$('btnLoadReturn').click()}catch(e){showError(e)}finally{endSubmit()}};

// ĐIỀU CHỈNH / ĐẢO
$('btnLoadAdjMaterial').onclick=async()=>{try{busy(true);state.adjustmentCtx=await call('apiAdjustmentContext',$('aMaterial').value.trim().toUpperCase());$('aMaterialInfo').textContent=`${state.adjustmentCtx.materialName} • Tồn ${fmt(state.adjustmentCtx.onHand)} ${state.adjustmentCtx.uom} • Giá BQ ${fmt(state.adjustmentCtx.avgCost)}`;if(!$('aCost').value)$('aCost').value=state.adjustmentCtx.avgCost||''}catch(e){showError(e)}finally{busy(false)}};
$('btnPostAdjustment').onclick=async()=>{if(!beginSubmit())return;try{if(!$('aConfirm').checked)throw new Error('Bạn chưa tick xác nhận điều chỉnh');const res=await call('apiCreateAndPostAdjustment',{materialId:$('aMaterial').value.trim().toUpperCase(),adjustmentDate:$('aDate').value,adjustmentType:$('aType').value,qty:n($('aQty').value),unitCost:n($('aCost').value),reasonCode:$('aReasonCode').value,reasonDetail:$('aReasonDetail').value,note:$('aNote').value,clientRequestId:stableReq('adj')});clearReq('adj');$('aConfirm').checked=false;showSuccess('Điều chỉnh tồn đã được ghi sổ.',res.adjustmentCode,`Tồn sau điều chỉnh: ${fmt(res.stockAfter)}`);$('btnLoadAdjMaterial').click()}catch(e){showError(e)}finally{endSubmit()}};
$('btnLoadReversal').onclick=async()=>{try{busy(true);state.reversalPreview=await call('apiReversalPreview',$('rvCode').value.trim().toUpperCase());renderReversal()}catch(e){showError(e)}finally{busy(false)}};
$('btnOpenDocs').onclick=()=>{openView('documents');$('btnDocsRecent').click()};
function renderReversal(){const x=state.reversalPreview;if(!x){$('rvPreview').innerHTML='';return;}let s=`<div style="padding:10px"><b>${esc(x.documentCode)}</b> • ${esc(x.documentTypeLabel||x.documentType)} • ${esc(x.date)} • Trạng thái: ${esc(x.status)}<br><span class="hint">Giao dịch gốc: <b>${esc(x.originalAction||'-')}</b></span></div><table><thead><tr><th>Vật tư</th><th>Số lượng</th><th>Giao dịch gốc</th><th>Tác động khi đảo</th><th>Tồn hiện tại</th><th>Tồn dự kiến</th><th>Đơn giá</th></tr></thead><tbody>`;x.lines.forEach(l=>s+=`<tr><td>${esc(l.materialId)} ${esc(l.materialName||'')}</td><td>${fmt(l.qty)}</td><td><b>${esc(l.sourceDirection||'-')}</b></td><td><b>${esc(l.reversalDirection||l.direction||'-')}</b></td><td>${fmt(l.stockBefore)}</td><td>${fmt(l.stockAfter)}</td><td>${fmt(l.unitCost)}</td></tr>`);$('rvPreview').innerHTML=s+'</tbody></table>'}
$('btnReverse').onclick=async()=>{if(!beginSubmit())return;try{if(!$('rvConfirm').checked)throw new Error('Bạn chưa tick xác nhận đảo giao dịch');if(!state.reversalPreview)throw new Error('Hãy kiểm tra chứng từ trước khi đảo');const res=await call('apiReversePostedDocument',{documentCode:$('rvCode').value.trim().toUpperCase(),reason:$('rvReason').value,clientRequestId:stableReq('rev')});clearReq('rev');$('rvConfirm').checked=false;showSuccess('Đã tạo giao dịch đảo, chứng từ gốc được giữ nguyên để truy vết.',res.reversalCode,`Chứng từ gốc: ${res.documentCode}\nSố dòng đảo: ${res.lineCount}`);state.reversalPreview=null;renderReversal()}catch(e){showError(e)}finally{endSubmit()}};

// TRA TỒN
$('btnSearchStock').onclick=async()=>{try{busy(true);const rows=await call('apiSearchStock',$('sQuery').value);let s='<table><thead><tr><th>Mã</th><th>Vật tư</th><th>ĐVT</th><th>Tồn</th><th>Đã giữ</th><th>Khả dụng</th><th>Giá BQ</th><th>Giá trị</th><th>Kiểm soát</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(x.materialId)}</td><td>${esc(x.materialName)}</td><td>${esc(x.uom)}</td><td>${fmt(x.onHand)}</td><td>${fmt(x.reserved)}</td><td>${fmt(x.available)}</td><td>${fmt(x.avgCost)}</td><td>${fmt(x.stockValue)}</td><td>${x.masterBlocked?'<span class="statusBlock">BLOCK MASTER</span>':'OK'}</td></tr>`).join('')+'</tbody></table>';$('sLines').innerHTML=s}catch(e){showError(e)}finally{busy(false)}};

// CHỨNG TỪ
function documentFilters(){return {documentCode:$('dCode').value.trim().toUpperCase(),documentType:$('dType').value,status:$('dStatus').value,dateFrom:$('dFrom').value,dateTo:$('dTo').value,executionCode:$('dExecution').value.trim().toUpperCase(),materialId:$('dMaterial').value.trim().toUpperCase(),supplierId:$('dSupplier').value.trim().toUpperCase(),userEmail:$('dUser').value.trim(),limit:50}}
async function loadDocuments(filters){try{busy(true);state.documents=await call('apiListDocuments',filters||documentFilters());renderDocuments()}catch(e){showError(e)}finally{busy(false)}}
function renderDocuments(){if(!state.documents.length){$('dLines').innerHTML='<div class="hint" style="padding:12px">Không tìm thấy chứng từ phù hợp.</div>';return;}const canRev=roleHas('PRODUCTION_MANAGER');let s='<table><thead><tr><th>Chứng từ</th><th>Ngày</th><th>Loại</th><th>Giao dịch gốc</th><th>BBSX/M/SH</th><th>Vật tư</th><th>NCC</th><th>SL</th><th>Người thao tác</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>';state.documents.forEach(x=>{const actions=`<div class="docAction"><button data-doc-view="${esc(x.documentCode)}">Xem</button>${canRev&&x.canReverse?`<button data-doc-reverse="${esc(x.documentCode)}">Chọn để đảo</button>`:''}</div>`;s+=`<tr><td><button class="docCodeBtn" data-doc-view="${esc(x.documentCode)}">${esc(x.documentCode)}</button></td><td>${esc(x.date)}</td><td>${esc(x.documentTypeLabel)}</td><td>${esc(x.originalAction)}</td><td>${esc(x.executionCode||'-')}</td><td>${esc(x.materialSummary||'-')}</td><td>${esc(x.supplierId||'-')}</td><td>${fmt(x.qty)}</td><td>${esc(x.userEmail||'-')}</td><td>${esc(x.status)}</td><td>${actions}</td></tr>`});$('dLines').innerHTML=s+'</tbody></table>';$('dLines').querySelectorAll('[data-doc-view]').forEach(b=>b.onclick=()=>showDocumentDetail(b.dataset.docView));$('dLines').querySelectorAll('[data-doc-reverse]').forEach(b=>b.onclick=()=>chooseDocumentForReverse(b.dataset.docReverse))}
async function showDocumentDetail(code){try{busy(true);const x=await call('apiDocumentDetail',String(code||'').toUpperCase());const detail=(x.lines||[]).map((l,i)=>`${i+1}. ${l.materialId}${l.productCode?' / '+l.productCode:''} • SL ${fmt(l.qty)} • Đơn giá ${fmt(l.unitCost)} • Thành tiền ${fmt(l.amount)}${l.sourceAction?' • '+l.sourceAction:''}`).join('\n');showModal({title:'Chi tiết chứng từ '+x.documentCode,message:`${x.documentTypeLabel} • ${x.date} • ${x.status} • Giao dịch gốc: ${x.originalAction}`,details:`BBSX/M/SH: ${x.executionCode||'-'}\nNCC: ${x.supplierId||'-'}\nNgười thao tác: ${x.userEmail||'-'}\n${detail}`})}catch(e){showError(e)}finally{busy(false)}}
async function chooseDocumentForReverse(code){if(!openView('adjustment')){showError(new Error('Bạn không có quyền đảo giao dịch'));return;}$('rvCode').value=String(code||'').toUpperCase();$('rvReason').value='';$('rvConfirm').checked=false;try{busy(true);state.reversalPreview=await call('apiReversalPreview',$('rvCode').value);renderReversal();document.getElementById('rvCode').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){showError(e)}finally{busy(false)}}
$('btnDocsRecent').onclick=()=>{$('dCode').value='';$('dType').value='';$('dStatus').value='';$('dFrom').value='';$('dTo').value='';$('dExecution').value='';$('dMaterial').value='';$('dSupplier').value='';$('dUser').value='';loadDocuments({limit:50})};
$('btnDocsSearch').onclick=()=>loadDocuments(documentFilters());

// HỆ THỐNG
$('btnSyncNow').onclick=async()=>{if(!beginSubmit())return;try{const res=await call('apiSyncAll');renderSync(res.status);showModal({title:'Đồng bộ hoàn tất',message:res.ok?'Tất cả nguồn đã đồng bộ.':'Một số nguồn có lỗi, xem bảng trạng thái.',details:(res.results||[]).map(x=>x.code+': '+(x.ok?'OK '+x.rows+' dòng':'LỖI '+x.error)).join('\n'),type:res.ok?'success':'error'})}catch(e){showError(e)}finally{endSubmit()}};
$('btnInstallTriggers').onclick=async()=>{if(!beginSubmit())return;try{const res=await call('apiInstallSyncTriggers');showModal({title:'Đã cài đồng bộ tự động',message:'Dữ liệu nguồn sẽ tự cập nhật theo lịch.',details:(res.triggers||[]).map(x=>x.handler+' — '+x.cadence).join('\n')})}catch(e){showError(e)}finally{endSubmit()}};
$('btnHealth').onclick=async()=>{try{busy(true);const h=await call('apiSystemHealth');renderHealth(h);showModal({type:h.status==='BLOCK'?'error':'success',title:'Kiểm tra hệ thống: '+h.status,message:`BLOCK: ${h.blockCount} • WARN: ${h.warnCount}`})}catch(e){showError(e)}finally{busy(false)}};

init();
</script>
